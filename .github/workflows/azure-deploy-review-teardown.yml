name: 'App Deploy [Azure - REVIEW TEARDOWN]'

on:
  pull_request:
    types:
      - closed
      - unlabeled

concurrency:
  group: review-${{ github.event.number }}
  cancel-in-progress: false

# Permissions for OIDC authentication
permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  DOCKER_IMAGE: ghcr.io/dfe-digital/early-years-foundation-recovery
  PR_NUMBER: pr-${{ github.event.number }}

jobs:
  teardown:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' || github.event.label.name == 'review')
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout cleanup script matching this workflow
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}

      # Login to Azure using OIDC
      - name: Login to Azure CLI
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Destroy Web Application
      - name: Destroy Azure Web Application
        uses: azure/CLI@v3
        env:
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          REVIEWAPP_NAME: ${{ vars.REVIEWAPP_NAME }}
          RESOURCE_NAME_PREFIX: ${{ vars.RESOURCE_NAME_PREFIX }}
        with:
          azcliversion: 2.74.0
          inlineScript: |
            bash .github/scripts/teardown_review.sh
