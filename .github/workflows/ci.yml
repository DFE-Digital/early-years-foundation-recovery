---
# ------------------------------------------------------------------------------
#
name: Continuous Integration
on:
  merge_group:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - .docker*
      - .env.example
      - .gitignore
      - .pa11yci
      - .tool-versions
      - .yardopts
      - bin/*
      - docker-compose.*
      - Dockerfile
      - terraform-azure

jobs:
  telemetry-config:
    name: Validate telemetry configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Validate Splunk and Azure collector configuration
        run: >-
          docker run --rm
          -e APPLICATION_INSIGHTS_CONNECTION_STRING=InstrumentationKey=00000000-0000-0000-0000-000000000000
          -e SPLUNK_REALM=eu0
          -e SPLUNK_ACCESS_TOKEN=test
          -e OTEL_SERVICE_NAME=early-years-foundation-recovery
          -e OTEL_SERVICE_VERSION=test
          -e OTEL_RESOURCE_ATTRIBUTES=deployment.environment.name=test
          -v "$PWD/otel-collector-config.yml:/etc/otelcol/config.yaml:ro"
          otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
          validate --config=/etc/otelcol/config.yaml
      - name: Validate Azure-only collector configuration
        run: >-
          docker run --rm
          -e APPLICATION_INSIGHTS_CONNECTION_STRING=InstrumentationKey=00000000-0000-0000-0000-000000000000
          -e OTEL_SERVICE_NAME=early-years-foundation-recovery
          -e OTEL_SERVICE_VERSION=test
          -e OTEL_RESOURCE_ATTRIBUTES=deployment.environment.name=test
          -v "$PWD/otel-collector-azure-config.yml:/etc/otelcol/config.yaml:ro"
          otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
          validate --config=/etc/otelcol/config.yaml
      - name: Validate local collector configuration
        run: >-
          docker run --rm
          -e OTEL_SERVICE_NAME=early-years-foundation-recovery
          -e OTEL_SERVICE_VERSION=local
          -e OTEL_RESOURCE_ATTRIBUTES=deployment.environment.name=development
          -v "$PWD/otel-collector-local-config.yml:/etc/otelcol/config.yaml:ro"
          otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
          validate --config=/etc/otelcol/config.yaml

  test:
    name: Test and lint code
    runs-on: ubuntu-latest
    environment: test
    env:
      ENVIRONMENT: test
      RAILS_ENV: test
      # https://github.com/DFE-Digital/early-years-foundation-recovery/settings/secrets/dependabot
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      DATABASE_URL: postgres://postgres:password@localhost:5432/test
      DOMAIN: recovery.app
      BOT_TOKEN: bot_token

    services:
      postgres:
        image: postgres:15.17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      -
        name: Checkout Code
        uses: actions/checkout@v4
      -
        name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.5
          bundler-cache: true
      -
        name: Install Rubygems
        run: bundle install --jobs 20 --retry 3
      -
        name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
      -
        name: Prepare test database
        run: bundle exec rails db:create db:migrate
      -
        name: Report schema version
        run: bundle exec rails db:version
      -
        name: Compile assets
        run: bundle exec rails assets:precompile
      -
        name: Run smoke suite (sign in journey)
        run: bundle exec rspec --tag smoke
        env:
          SMOKE_SKIP_COVERAGE_CHECK: 'true'
      -
        name: Run test suite
        run: bundle exec rspec --tag ~smoke
      -
        name: Run rubocop
        run: bundle exec rubocop
