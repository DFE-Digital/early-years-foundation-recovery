name: Mirror approved base images

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/base-images.yml
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: base-image-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: vars.ENABLE_BASE_IMAGE_MIRROR == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: v0.31.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror approved multi-platform images
        env:
          BASE_IMAGE: ghcr.io/dfe-digital/early-years-foundation-recovery/base
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/DFE-Digital/early-years-foundation-recovery" \
            --tag "$BASE_IMAGE:ruby-3.4.5-alpine" \
            docker.io/library/ruby:3.4.5-alpine
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/DFE-Digital/early-years-foundation-recovery" \
            --tag "$BASE_IMAGE:otel-0.161.0" \
            docker.io/otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1

      - name: Report mirrored image digests
        run: |
          set -euo pipefail
          for tag in ruby-3.4.5-alpine otel-0.161.0; do
            docker buildx imagetools inspect \
              "ghcr.io/dfe-digital/early-years-foundation-recovery/base:$tag" \
              >> "$GITHUB_STEP_SUMMARY"
          done
