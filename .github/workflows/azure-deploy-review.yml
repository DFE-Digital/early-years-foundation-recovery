name: "App Deploy [Azure - REVIEW]"

on:
  pull_request:
    types: [opened, reopened, labeled, unlabeled, synchronize, closed]

permissions:
  id-token: write
  contents: read
  packages: write
  pull-requests: write

concurrency:
  group: review-app-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  DOCKER_IMAGE: ghcr.io/dfe-digital/early-years-foundation-recovery
  PR_NUMBER: pr-${{ github.event.pull_request.number }}

jobs:
  reconcile:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (contains(github.event.pull_request.labels.*.name, 'review') ||
      github.event.action == 'closed' || github.event.label.name == 'review')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: development
    steps:
      - name: Check current PR state
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          REQUESTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$GH_REPO/pulls/$NUMBER")"
          if jq -e '.state == "closed" or ([.labels[].name] | index("review") | not)' <<<"$pr" >/dev/null; then
            echo "action=cleanup" >> "$GITHUB_OUTPUT"
          elif [ "$(jq -r '.head.sha' <<<"$pr")" = "$REQUESTED_SHA" ]; then
            echo "action=deploy" >> "$GITHUB_OUTPUT"
          else
            echo "Ignoring stale deployment request"
          fi

      - name: Checkout requested commit
        if: steps.state.outputs.action != ''
        uses: actions/checkout@v4
        with:
          # Open-PR cleanup uses the script on this PR; closed-PR cleanup remains available after branch deletion.
          ref: ${{ github.event.action == 'closed' && github.event.repository.default_branch || github.event.pull_request.head.sha }}

      - name: Setup Ruby
        if: steps.state.outputs.action != ''
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.10

      - name: Set up Docker Buildx
        if: steps.state.outputs.action == 'deploy'
        uses: docker/setup-buildx-action@v3
        with:
          version: v0.31.1

      - name: Login to GitHub Container Registry
        if: steps.state.outputs.action == 'deploy'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Rails
        if: steps.state.outputs.action == 'deploy'
        uses: docker/build-push-action@v6
        with:
          target: app
          context: .
          push: true
          build-args: SHA=${{ github.event.pull_request.head.sha }}
          cache-from: |
            ${{ env.DOCKER_IMAGE }}:deps
            ${{ env.DOCKER_IMAGE }}:latest
          tags: ${{ env.DOCKER_IMAGE }}:${{ github.event.pull_request.head.sha }}

      - name: Build and push review ingress
        if: steps.state.outputs.action == 'deploy'
        uses: docker/build-push-action@v6
        with:
          context: docker/review
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:review-ingress-${{ github.event.pull_request.head.sha }}

      - name: Login to Azure
        if: steps.state.outputs.action != ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Reconcile review resources
        if: steps.state.outputs.action != ''
        id: resources
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          REVIEWAPP_NAME: ${{ vars.REVIEWAPP_NAME }}
          POSTGRES_SERVER: ${{ vars.RESOURCE_NAME_PREFIX }}-psqlfs
          PSQLFS_USERNAME: ${{ secrets.PSQLFS_USERNAME }}
          PSQLFS_PASSWORD: ${{ secrets.PSQLFS_PASSWORD }}
          AZURE_REVIEW_APP_SUBNET: ${{ secrets.AZURE_REVIEW_APP_SUBNET }}
          AZURE_VNET: ${{ secrets.AZURE_VNET }}
          RAILS_IMAGE: ${{ env.DOCKER_IMAGE }}:${{ github.event.pull_request.head.sha }}
          INGRESS_IMAGE: ${{ env.DOCKER_IMAGE }}:review-ingress-${{ github.event.pull_request.head.sha }}
          ACTION: ${{ steps.state.outputs.action }}
        run: ruby .github/scripts/review_app.rb "$ACTION"

      - name: Smoke test sign in
        if: steps.state.outputs.action == 'deploy'
        env:
          REVIEW_APP_URL: ${{ steps.resources.outputs.url }}
        run: bash .github/scripts/smoke_sign_in.sh "$REVIEW_APP_URL" review

      - name: Setup Node
        if: steps.state.outputs.action == 'deploy'
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Verify browser login and logout
        if: steps.state.outputs.action == 'deploy'
        env:
          REVIEW_APP_URL: ${{ steps.resources.outputs.url }}
          GOV_ONE_CLIENT_ID: review-${{ env.PR_NUMBER }}
        run: |
          corepack enable
          yarn install --immutable
          node --test spec/e2e/gov_one_login.test.mjs

      - name: Capture container status
        if: failure() && steps.resources.outcome != 'skipped' && steps.state.outputs.action == 'deploy'
        env:
          GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.REVIEWAPP_NAME }}
        run: |
          mkdir -p tmp/login-e2e
          az webapp sitecontainers list --resource-group "$GROUP" --name "$APP" --slot "$PR_NUMBER" \
            --query '[].{name:name,image:image,isMain:isMain}' \
            > tmp/login-e2e/containers.json
          az webapp log download --resource-group "$GROUP" --name "$APP" --slot "$PR_NUMBER" \
            --log-file tmp/login-e2e/startup-logs.zip

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: review-app-${{ env.PR_NUMBER }}-failure
          path: tmp/login-e2e/
          retention-days: 7

      - name: Comment verified review URL
        if: steps.state.outputs.action == 'deploy'
        uses: mshick/add-pr-comment@v3
        with:
          message-id: review-app
          message: |
            Review app verified for `${{ github.event.pull_request.head.sha }}`:
            ${{ steps.resources.outputs.url }}

            Use synthetic identities only. Enter a new subject/email in the simulator for a new account,
            or reuse the same subject/email for a returning account.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark review app removed
        if: steps.state.outputs.action == 'cleanup'
        uses: mshick/add-pr-comment@v3
        with:
          message-id: review-app
          message: Review app and PR database removed.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
