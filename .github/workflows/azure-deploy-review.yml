name: "App Deploy [Azure - REVIEW]"

on:
  pull_request:
    types:
      - labeled # uses 'review'
      - synchronize
      - reopened
    paths-ignore:
      - "**/*.md"
      - .docker*
      - .env.example
      - .gitignore
      - .pa11yci
      - .tool-versions
      - .yardopts
      - docker-compose.*
      - uml/*

concurrency:
  group: review-${{ github.event.number }}
  cancel-in-progress: false

# Permissions for OIDC authentication and URL comment step
permissions:
  id-token: write
  contents: read
  packages: write
  pull-requests: write

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  DOCKER_IMAGE: ghcr.io/dfe-digital/early-years-foundation-recovery
  PR_NUMBER: pr-${{ github.event.number }}

jobs:
  build-and-deploy:
    if: contains(github.event.pull_request.labels.*.name, 'review') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: development

    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Create and boot Docker image builder
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: v0.31.1

      # Login to the container registry
      - name: Login to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push image
      - name: Build and push dependencies
        uses: docker/build-push-action@v6
        with:
          target: deps
          context: .
          push: true
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            SHA=${{ github.event.pull_request.head.sha }}
          cache-from: |
            ${{ env.DOCKER_IMAGE }}:deps
          tags: ${{ env.DOCKER_IMAGE }}:deps

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          target: app
          context: .
          push: true
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            SHA=${{ github.event.pull_request.head.sha }}
          cache-from: |
            ${{ env.DOCKER_IMAGE }}:${{ github.event.pull_request.head.sha }}
            ${{ env.DOCKER_IMAGE }}:${{ env.PR_NUMBER }}
            ${{ env.DOCKER_IMAGE }}:latest
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.event.pull_request.head.sha }}
            ${{ env.DOCKER_IMAGE }}:${{ env.PR_NUMBER }}

      - name: Build and push review proxy
        uses: docker/build-push-action@v6
        with:
          target: review-proxy
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:review-proxy-${{ github.event.pull_request.head.sha }}

      - name: Login to Azure CLI
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check review deployment is still requested
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr view "${PR_NUMBER#pr-}" --json state,labels,headRefOid |
            jq -e --arg sha "$EXPECTED_SHA" \
              '.state == "OPEN" and .headRefOid == $sha and any(.labels[]; .name == "review")'

      # Deploy Web Application
      - name: Deploy to Azure App Services
        uses: azure/CLI@v3
        env:
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          REVIEWAPP_NAME: ${{ vars.REVIEWAPP_NAME }}
          RESOURCE_NAME_PREFIX: ${{ vars.RESOURCE_NAME_PREFIX }}
          IMAGE_SHA: ${{ github.event.pull_request.head.sha }}
          PSQLFS_USERNAME: ${{ secrets.PSQLFS_USERNAME }}
          PSQLFS_PASSWORD: ${{ secrets.PSQLFS_PASSWORD }}
          REVIEW_APP_SUBNET: ${{ secrets.AZURE_REVIEW_APP_SUBNET }}
          AZURE_VNET: ${{ secrets.AZURE_VNET }}
        with:
          azcliversion: 2.74.0
          inlineScript: |
            bash .github/scripts/deploy_review.sh

      - name: Smoke test sign in journey
        run: bash .github/scripts/smoke_sign_in.sh "https://${{ vars.REVIEWAPP_NAME }}-${{ env.PR_NUMBER }}.azurewebsites.net" "https://${{ vars.REVIEWAPP_NAME }}-${{ env.PR_NUMBER }}.azurewebsites.net"

      - name: Set up Node for browser verification
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Verify deployed login journey
        env:
          REVIEW_APP_URL: https://${{ vars.REVIEWAPP_NAME }}-${{ env.PR_NUMBER }}.azurewebsites.net
          GOV_ONE_CLIENT_ID: review-${{ env.PR_NUMBER }}
        run: |
          corepack enable
          yarn install --immutable
          mkdir -p tmp/login-e2e
          node --test spec/e2e/gov_one_login.test.mjs

      - name: Upload login failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: review-login-failure-${{ env.PR_NUMBER }}
          path: tmp/login-e2e/
          retention-days: 7

      # Add URL to Pull Request
      - name: Comment URL to PR
        uses: mshick/add-pr-comment@v3
        with:
          message: https://${{ vars.REVIEWAPP_NAME }}-${{ env.PR_NUMBER }}.azurewebsites.net
          repo-token: ${{ secrets.GITHUB_TOKEN }}
