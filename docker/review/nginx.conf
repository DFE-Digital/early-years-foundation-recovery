log_format review '$remote_addr $request_method $uri $status';

server {
    listen 8080;
    server_tokens off;
    access_log /var/log/nginx/access.log review;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Rails login redirects include session cookies and a large CSP header.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    # Never expose the simulator's read/write configuration API.
    location ^~ /config { return 404; }

    location = /authorize {
        root /usr/share/nginx/html/review-login;
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }
    location = /review-login/authorize {
        proxy_pass http://127.0.0.1:4001/authorize;
        proxy_set_header Accept-Encoding "";
        add_header Cache-Control "no-store";
    }
    location = /review-login/picker.js { root /usr/share/nginx/html; }
    location = /review-login/picker.css { root /usr/share/nginx/html; }
    location = /form-submit { proxy_pass http://127.0.0.1:4001; }
    location = /logout { proxy_pass http://127.0.0.1:4001; }
    location = /token { proxy_pass http://127.0.0.1:4001; }
    location = /userinfo { proxy_pass http://127.0.0.1:4001; }
    location = /.well-known/openid-configuration { proxy_pass http://127.0.0.1:4001; }
    location = /.well-known/jwks.json { proxy_pass http://127.0.0.1:4001; }

    location / { proxy_pass http://127.0.0.1:3000; }
}
