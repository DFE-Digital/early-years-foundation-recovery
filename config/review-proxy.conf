server {
    listen 8080;
    server_name _;

    # Azure terminates TLS; Rails must still see HTTPS for secure sessions.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_redirect off;
    # The OIDC callback sets several cookies, including the signed-in session.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    location ~ ^/(authorize|form-submit|token|userinfo|logout|trustmark|\.well-known/(openid-configuration|jwks\.json))$ {
        proxy_pass http://127.0.0.1:4000;
    }

    # Never expose the simulator's configuration API.
    location = /config { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
